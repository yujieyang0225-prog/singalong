[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singalong"
version = "0.1.0"
description = "Live sing-along accompaniment: audio bands -> C1 SNN -> chord pitch classes (NeuroTUM hackathon)"
authors = [{ name = "Jan Vitzthum" }]
requires-python = ">=3.10"

[tool.setuptools]
packages = { find = { include = ["singalong*"] } }
